<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Ollama Monitor</h1>
      <div class="status-bar">
        <span id="ollamaStatus">Ollama: checking...</span>
        <span id="monitorStatus">Monitor: stopped</span>
        <span id="lastCheck">Last check: --</span>
      </div>
      <div class="controls">
        <button id="startBtn">Start Monitor</button>
        <button id="stopBtn" disabled>Stop Monitor</button>
        <button id="clearBtn">Clear History</button>
        <button id="shutdownBtn" title="Shut down server">Shut Down Server</button>
      </div>
    </header>
    <section class="active">
      <h2>Active Models</h2>
      <div id="activeList" class="empty">No models currently running</div>
    </section>

    <div id="panelBackdrop" class="panel-backdrop"></div>
    <div id="modelPanel" class="model-panel">
      <div class="panel-header">
        <h3 id="panelModelName">Model</h3>
        <button id="panelClose">&times;</button>
      </div>
      <div class="panel-content" id="panelContent">
        <div style="color:#94a3b8;font-size:12px">Select a model above</div>
      </div>
      <div class="panel-actions">
        <button id="btnInfo" class="panel-btn">Show info about model</button>
        <button id="btnGentle" class="panel-btn gentle">Stop model gentle (5 min)</button>
        <button id="btnForce" class="panel-btn danger">Stop model now (forced)</button>
      </div>
    </div>
    <section class="history">
      <h2>Recent Activity (last few days)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Event</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
